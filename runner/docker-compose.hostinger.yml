# Compose file for the Hostinger "Deploy to Hostinger VPS" GitHub Action
# (.github/workflows/runner-deploy.yml). Mirrors the EXISTING Docker Manager project "runner":
# same container name, build source (this repo, branch main, folder runner/), named volume
# siteops_video_data and Traefik routing for browse.lorzen.de on the external coolify network.
# The token is passed by the workflow as an environment variable and never stored here.
services:
  siteops-browser-runner:
    build:
      context: https://github.com/derlorzen/siteOps.git#main:runner
    container_name: siteops-browser-runner
    environment:
      BROWSER_RUNNER_TOKEN: ${BROWSER_RUNNER_TOKEN:?BROWSER_RUNNER_TOKEN is required}
      VIDEO_OUTPUT_DIR: /data/video-studio
      VIDEO_MODEL_DIR: /data/video-studio/models
      VIDEO_ALLOWED_HOSTS: ${VIDEO_ALLOWED_HOSTS:-shop.lorzen.link}
    expose:
      - 3200
    labels:
      - traefik.enable=true
      - traefik.http.routers.siteops-runner.rule=Host(`${RUNNER_HOST:-browse.lorzen.de}`)
      - traefik.http.routers.siteops-runner.entrypoints=https
      - traefik.http.routers.siteops-runner.tls.certresolver=letsencrypt
      - traefik.http.services.siteops-runner.loadbalancer.server.port=3200
      - 'traefik.docker.network=coolify'
      - 'traefik.http.routers.siteops-runner.service=siteops-runner'
    restart: unless-stopped
    volumes:
      - siteops_video_data:/data/video-studio
    networks:
      - coolify

networks:
  coolify:
    external: true

volumes:
  siteops_video_data:
