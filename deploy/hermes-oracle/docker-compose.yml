# Hermes Agent on Oracle A1 via Coolify. Public endpoint: Hermes dashboard (9119) and optional Webapp (9120).
# Credentials live exclusively in Coolify application environment variables.
services:
  hermes-config:
    exclude_from_hc: true
    image: alpine:3.21
    restart: "no"
    volumes:
      - hermes-oracle-data:/opt/data
    command:
      - /bin/sh
      - -ec
      - |
          mkdir -p /opt/data
          if [ ! -f /opt/data/config.yaml ]; then
            printf '%s\n' \
              'webapp:' \
              '  enabled: true' \
              '  host: 0.0.0.0' \
              '  port: 9120' \
              '  public_url: https://ki.lorzen.net' \
              'tool_loop_guardrails:' \
              '  non_interactive_hard_stop_enabled: true' \
              > /opt/data/config.yaml
          fi
          # Reconcile only the prior generated public origin; leave other user settings untouched.
          sed -i 's#https://ki.lorzen.de#https://ki.lorzen.net#g' /opt/data/config.yaml
          chown 10000:10000 /opt/data /opt/data/config.yaml
  hermes:
    image: nousresearch/hermes-agent:stable
    command: ["gateway", "run"]
    restart: unless-stopped
    init: false
    environment:
      HERMES_DASHBOARD: "1"
      HERMES_TIMEZONE: Europe/Berlin
      HERMES_DASHBOARD_HOST: "0.0.0.0"
      HERMES_DASHBOARD_PORT: "9119"
      HERMES_DASHBOARD_PUBLIC_URL: "https://ki.lorzen.net"
      HERMES_DASHBOARD_OAUTH_CLIENT_ID: "agent:cmw9u54gn005alh0hkcwuqd4r"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:?Missing dashboard username}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:?Missing dashboard password}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_BASIC_AUTH_SECRET:?Missing dashboard secret}
    volumes:
      - hermes-oracle-data:/opt/data
    expose:
      - "9119"
      - "9120"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import http.client,sys; c=http.client.HTTPConnection('127.0.0.1',9119,timeout=4); c.request('GET','/'); r=c.getresponse(); sys.exit(0 if r.status in (200,301,302,303,307,308,401,403) else 1)"
      interval: 30s
      timeout: 8s
      start_period: 90s
      retries: 4
    depends_on:
      hermes-config:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2048M
    networks:
      - default
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.hermes-admin.rule=Host(`hermes-admin.lorzen.net`)"
      - "traefik.http.routers.hermes-admin.entrypoints=https"
      - "traefik.http.routers.hermes-admin.tls=true"
      - "traefik.http.routers.hermes-admin.tls.certresolver=letsencrypt"
      - "traefik.http.routers.hermes-admin.service=hermes-admin"
      - "traefik.http.services.hermes-admin.loadbalancer.server.port=9119"
  # The hermes-agent-src named volume was initialized from the Hermes image
  # during the first deployment and is retained while mounted by hermes-webui.
  # Parallel ChatGPT-like UI. Existing Hermes dashboard and OAuth remain intact.
  hermes-webui:
    build:
      context: .
      dockerfile: Dockerfile.selene
    restart: unless-stopped
    environment:
      HERMES_HOME: /home/hermeswebui/.hermes
      HERMES_WEBUI_AGENT_DIR: /home/hermeswebui/.hermes/hermes-agent
      HERMES_WEBUI_HOST: "0.0.0.0"
      HERMES_WEBUI_PORT: "8787"
      HERMES_WEBUI_STATE_DIR: /home/hermeswebui/.hermes/webui
      HERMES_WEBUI_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:?Missing Hermes WebUI authentication}
      WANTED_UID: "10000"
      WANTED_GID: "10000"
      # Only the local nginx sidecar may assert a verified Nous identity.
      HERMES_WEBUI_TRUSTED_AUTH_HEADER: "X-Hermes-SSO-User"
      HERMES_WEBUI_TRUSTED_PROXY_CIDRS: "127.0.0.1/32"
    volumes:
      - hermes-oracle-data:/home/hermeswebui/.hermes
      - hermes-agent-src:/home/hermeswebui/.hermes/hermes-agent:ro
    expose:
      - "8787"
      - "8080"
    depends_on:
      hermes-config:
        condition: service_completed_successfully
    networks:
      - default
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.hermes-selene.rule=Host(`selene.lorzen.net`)"
      - "traefik.http.routers.hermes-selene.entrypoints=https"
      - "traefik.http.routers.hermes-selene.tls=true"
      - "traefik.http.routers.hermes-selene.tls.certresolver=letsencrypt"
      - "traefik.http.routers.hermes-selene.service=hermes-selene"
      - "traefik.http.services.hermes-selene.loadbalancer.server.port=8787"
      - "traefik.http.routers.hermes-selene-sso.rule=Host(`selene-sso.lorzen.net`)"
      - "traefik.http.routers.hermes-selene-sso.entrypoints=https"
      - "traefik.http.routers.hermes-selene-sso.tls=true"
      - "traefik.http.routers.hermes-selene-sso.tls.certresolver=letsencrypt"
      - "traefik.http.routers.hermes-selene-sso.service=hermes-selene-sso"
      - "traefik.http.services.hermes-selene-sso.loadbalancer.server.port=8080"
      # Primary application routing wins over the old Hermes dashboard and
      # the legacy /selene-sso/authorize sidecar route.
      - "traefik.http.routers.hermes-ki.rule=Host(`ki.lorzen.net`)"
      - "traefik.http.routers.hermes-ki.priority=3000"
      - "traefik.http.routers.hermes-ki.entrypoints=https"
      - "traefik.http.routers.hermes-ki.tls=true"
      - "traefik.http.routers.hermes-ki.tls.certresolver=letsencrypt"
      - "traefik.http.routers.hermes-ki.service=hermes-ki"
      - "traefik.http.services.hermes-ki.loadbalancer.server.port=8080"


  # One-time secret init. Signing key survives SSO and WebUI deployments.
  selene-sso-init:
    exclude_from_hc: true
    image: alpine:3.21
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mkdir -p /state
        if [ ! -s /state/signing-key ]; then
          (umask 077; head -c 32 /dev/urandom > /state/signing-key)
        fi
        chmod 600 /state/signing-key
        chown 11001:11001 /state/signing-key
    volumes:
      - selene-sso-state:/state

  # OAuth-to-SSO broker: verifies the existing Nous dashboard session; no password or portal token is stored.
  hermes-sso:
    build:
      context: .
      dockerfile: Dockerfile.selene-sso
    restart: unless-stopped
    environment:
      SELENE_SSO_SECRET_FILE: /sso-state/signing-key
    volumes:
      - selene-sso-state:/sso-state:ro
    depends_on:
      selene-sso-init:
        condition: service_completed_successfully
    expose:
      - "8181"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8181/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - default
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.hermes-sso-ki.rule=Host(`ki.lorzen.net`) && PathPrefix(`/selene-sso/authorize`)"
      - "traefik.http.routers.hermes-sso-ki.entrypoints=https"
      - "traefik.http.routers.hermes-sso-ki.priority=1000"
      - "traefik.http.routers.hermes-sso-ki.tls=true"
      - "traefik.http.routers.hermes-sso-ki.tls.certresolver=letsencrypt"
      - "traefik.http.services.hermes-sso-ki.loadbalancer.server.port=8181"

  # Shares the WebUI network namespace, so the trusted identity header arrives
  # exclusively from 127.0.0.1. Public traffic to the normal 8787 password URL
  # continues unchanged until the preview is verified end-to-end.
  selene-sso-proxy:
    build:
      context: .
      dockerfile: Dockerfile.selene-nginx
    restart: unless-stopped
    network_mode: "service:hermes-webui"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/__internal_health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      hermes-webui:
        condition: service_started
      hermes-sso:
        condition: service_healthy
      hermes:
        condition: service_started

volumes:
  hermes-agent-src:
  hermes-oracle-data:
  selene-sso-state:

networks:
  coolify:
    external: true
