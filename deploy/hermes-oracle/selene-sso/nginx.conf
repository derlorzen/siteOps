worker_processes  1;
events { worker_connections 2048; }
http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    server {
        listen 8080;
        access_log off;
        server_name selene-sso.lorzen.net;
        server_tokens off;
        client_max_body_size 50m;
        add_header X-Content-Type-Options nosniff always;

        location = /__internal_health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok";
        }

        location = /__selene_auth {
            internal;
            proxy_pass http://hermes-sso:8181/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Host selene-sso.lorzen.net;
        }

        location ^~ /selene-sso/ {
            proxy_pass http://hermes-sso:8181;
            proxy_set_header Host $host;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 10s;
        }

        location @login_with_nous {
            return 302 https://selene-sso.lorzen.net/selene-sso/start;
        }

        location / {
            auth_request /__selene_auth;
            auth_request_set $validated_user $upstream_http_x_sso_user;
            error_page 401 = @login_with_nous;

            proxy_pass http://127.0.0.1:8787;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Hermes-SSO-User $validated_user;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
