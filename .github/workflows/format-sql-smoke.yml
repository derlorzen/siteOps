name: Format SQL Integration Test
on:
  push:
    branches:
      - fix/workspace-sql-integration
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/workspace-sql-integration
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write app.mjs test/migrations.test.mjs
      - name: Commit formatted integration tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.mjs test/migrations.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style: format SQL integration regression"
            git push origin HEAD:fix/workspace-sql-integration
          fi
