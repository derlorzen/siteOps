name: Temporary ALL-INKL DNS Formatter
on:
  push:
    branches:
      - fix/allinkl-domain-picker-soap-response
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'derlorzen/siteOps'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/allinkl-domain-picker-soap-response
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Format changed source and tests
        run: npx prettier --write app.mjs lib/allinkl.mjs lib/allinkl-ui.mjs test/allinkl-domain-discovery.test.mjs public/allinkl.js
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "SiteOps CI Formatter"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app.mjs lib/allinkl.mjs lib/allinkl-ui.mjs test/allinkl-domain-discovery.test.mjs public/allinkl.js
            git commit -m "style: format ALL-INKL DNS domain picker and SOAP response fix"
            git push origin HEAD:fix/allinkl-domain-picker-soap-response
          fi
