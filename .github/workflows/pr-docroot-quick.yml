name: Temporary docroot quick test

on:
  push:
    branches: [fix/allinkl-subdomain-docroot-mapping]

permissions:
  contents: read

jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test test/allinkl-docroot-repair.test.mjs
