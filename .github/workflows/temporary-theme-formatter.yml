name: Temporary theme formatter
on:
  push:
    branches: [feat/siteops-themed-sites-admin-recovery]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/siteops-themed-sites-admin-recovery
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write app.mjs lib/lorzcms.mjs
      - name: Commit formatting
        run: |
          git config user.name "SiteOps CI Formatter"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app.mjs lib/lorzcms.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style: format theme management"
            git push origin HEAD:feat/siteops-themed-sites-admin-recovery
          fi
