name: Temporary ACME Fallback Formatter
on:
  push:
    branches:
      - fix/acme-verified-http01-dns-fallback
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/acme-verified-http01-dns-fallback
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npx prettier --write lib/allinkl-ssl.mjs test/allinkl-ssl.test.mjs
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "SiteOps CI Formatter"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add lib/allinkl-ssl.mjs test/allinkl-ssl.test.mjs
            git commit -m "style: format ACME nginx fallback"
            git push origin HEAD:fix/acme-verified-http01-dns-fallback
          fi
