name: Temporary KAS Login Formatter
on:
  push:
    branches:
      - fix/allinkl-kas-login-alphanumeric
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'derlorzen/siteOps'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/allinkl-kas-login-alphanumeric
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npx prettier --write lib/allinkl.mjs test/allinkl.test.mjs
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "SiteOps CI Formatter"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add lib/allinkl.mjs test/allinkl.test.mjs
            git commit -m "style: format alphanumeric KAS login fix"
            git push origin HEAD:fix/allinkl-kas-login-alphanumeric
          fi
