name: Temporary MCP Discovery Formatter
on:
  push:
    branches:
      - fix/mcp-tools-discovery-after-oauth
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'derlorzen/siteOps'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mcp-tools-discovery-after-oauth
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npx prettier --write lib/website-factory.mjs test/website-insurance.test.mjs app.mjs
      - name: Commit formatted source
        run: |
          if ! git diff --quiet; then
            git config user.name "SiteOps CI Formatter"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add lib/website-factory.mjs test/website-insurance.test.mjs app.mjs
            git commit -m "style: format MCP discovery fix"
            git push origin HEAD:fix/mcp-tools-discovery-after-oauth
          fi
