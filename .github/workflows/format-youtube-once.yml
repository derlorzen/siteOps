name: Format YouTube Analytics once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/format-youtube-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npx prettier --write lib/youtube.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/youtube.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style: format YouTube Analytics service"
            git push origin HEAD:refs/heads/repair/youtube-analytics-format
          fi
