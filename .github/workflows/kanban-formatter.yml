name: Format Kanban implementation
on:
  push:
    branches:
      - feat/billing-kanban-board
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/billing-kanban-board
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format Kanban code
        run: npx prettier --write lib/billing-board.mjs lib/billing.mjs test/billing-board.test.mjs
      - name: Commit formatter changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/billing-board.mjs lib/billing.mjs test/billing-board.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style: format Kanban module and tests"
            git push origin HEAD:feat/billing-kanban-board
          fi
