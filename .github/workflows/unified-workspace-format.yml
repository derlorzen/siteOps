name: Format unified SiteOps workspace
on:
  push:
    branches:
      - feat/unified-siteops-workspace
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/unified-siteops-workspace
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write app.mjs lib/site-projects.mjs test/site-projects.test.mjs
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.mjs lib/site-projects.mjs test/site-projects.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style: format shared workspace and site project API"
            git push origin HEAD:feat/unified-siteops-workspace
          fi
