name: Temporary SSL DNS Diagnostics Formatter
on:
  push:
    branches:
      - fix/ssl-authoritative-dns-diagnostics
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ssl-authoritative-dns-diagnostics
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npx prettier --write app.mjs lib/allinkl-ssl.mjs test/allinkl-ssl.test.mjs
      - run: |
          if ! git diff --quiet; then
            git config user.name "SiteOps CI Formatter"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app.mjs lib/allinkl-ssl.mjs test/allinkl-ssl.test.mjs
            git commit -m "style: format authoritative DNS diagnostics"
            git push origin HEAD:fix/ssl-authoritative-dns-diagnostics
          fi
