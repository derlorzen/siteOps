name: Temporary htaccess Test Formatter
on:
  push:
    branches: [fix/lorzcms-acme-http-challenge-rewrite]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lorzcms-acme-http-challenge-rewrite
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npx prettier --write test/lorzcms-htaccess.test.mjs
      - run: |
          if ! git diff --quiet; then
            git config user.name "SiteOps CI Formatter"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add test/lorzcms-htaccess.test.mjs
            git commit -m "style: format ACME htaccess regression test"
            git push origin HEAD:fix/lorzcms-acme-http-challenge-rewrite
          fi
