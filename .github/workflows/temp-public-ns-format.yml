name: Temporary Public DNS Formatter
on:
  push:
    branches:
      - fix/allinkl-diagnostics-public-ns
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/allinkl-diagnostics-public-ns
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npx prettier --write lib/allinkl.mjs
      - run: |
          if ! git diff --quiet; then
            git config user.name "SiteOps CI Formatter"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add lib/allinkl.mjs
            git commit -m "style: format public DNS nameserver diagnostics"
            git push origin HEAD:fix/allinkl-diagnostics-public-ns
          fi
