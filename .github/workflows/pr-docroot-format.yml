name: Temporary SiteOps PR formatter

on:
  push:
    branches: [fix/allinkl-subdomain-docroot-mapping]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/allinkl-subdomain-docroot-mapping
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write app.mjs lib/allinkl.mjs test/allinkl-docroot-repair.test.mjs
      - name: Commit only formatting changes
        run: |
          git config user.name "SiteOps CI Formatter"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app.mjs lib/allinkl.mjs test/allinkl-docroot-repair.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style: format document-root repair"
            git push origin HEAD:fix/allinkl-subdomain-docroot-mapping
          fi
