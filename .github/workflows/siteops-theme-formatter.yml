name: Format SiteOps theme
on:
  push:
    branches:
      - feat/siteops-customizable-accent-theme
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/siteops-customizable-accent-theme
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write app.mjs lib/siteops-theme.mjs test/siteops-theme.test.mjs
      - name: Commit formatted sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.mjs lib/siteops-theme.mjs test/siteops-theme.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style: format SiteOps theme implementation"
            git push origin HEAD:feat/siteops-customizable-accent-theme
          fi
