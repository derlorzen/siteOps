name: Temporary ALL-INKL PR Formatter
on:
  push:
    branches:
      - feat/allinkl-kas-lorzcms-provisioning
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'derlorzen/siteOps'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/allinkl-kas-lorzcms-provisioning
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install formatter
        run: npm ci --ignore-scripts
      - name: Format project changes
        run: npx prettier --write app.mjs lib/allinkl.mjs lib/allinkl-ui.mjs lib/lorzcms.mjs lib/lorzcms-workspace.mjs test/allinkl.test.mjs
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "SiteOps CI Formatter"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app.mjs lib/allinkl.mjs lib/allinkl-ui.mjs lib/lorzcms.mjs lib/lorzcms-workspace.mjs test/allinkl.test.mjs
            git commit -m "style: apply Prettier formatting to ALL-INKL integration"
            git push origin HEAD:feat/allinkl-kas-lorzcms-provisioning
          fi
