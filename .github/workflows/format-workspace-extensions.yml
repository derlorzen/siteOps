name: Format Workspace Extensions
on:
  push:
    branches:
      - feat/workspace-search-360-activity
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/workspace-search-360-activity
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write app.mjs lib/connection-profiles.mjs lib/project-overview.mjs lib/workspace-activity.mjs lib/workspace-search.mjs test/workspace-additions.test.mjs
      - name: Commit formatted sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.mjs lib/connection-profiles.mjs lib/project-overview.mjs lib/workspace-activity.mjs lib/workspace-search.mjs test/workspace-additions.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style: format workspace extensions"
            git push origin HEAD:feat/workspace-search-360-activity
          fi
