name: Temporary Coolify Formatter
on:
  push:
    branches:
      - feat/coolify-supabase-per-project
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'derlorzen/siteOps'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/coolify-supabase-per-project
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npx prettier --write app.mjs lib/coolify.mjs lib/coolify-ui.mjs public/coolify.js test/coolify.test.mjs
      - name: Commit formatted files
        run: |
          if ! git diff --quiet; then
            git config user.name "SiteOps CI Formatter"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app.mjs lib/coolify.mjs lib/coolify-ui.mjs public/coolify.js test/coolify.test.mjs
            git commit -m "style: format Coolify and Supabase integration"
            git push origin HEAD:feat/coolify-supabase-per-project
          fi
