name: Format LorzCMS integration
on:
  push:
    branches: [fix/lorzcms-adoption-profiles-project-ui]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lorzcms-adoption-profiles-project-ui
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write lib/lorzcms.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/lorzcms.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style: format retry-safe CMS connector"
            git push origin HEAD:fix/lorzcms-adoption-profiles-project-ui
          fi
