name: Temporary ACME Dependency and Formatter
on:
  push:
    branches:
      - feat/allinkl-acme-ssl-auto
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'derlorzen/siteOps'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/allinkl-acme-ssl-auto
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --save-exact acme-client@5.4.0 --ignore-scripts
      - run: npx prettier --write app.mjs lib/allinkl.mjs lib/allinkl-ssl.mjs lib/lorzcms.mjs lib/allinkl-ui.mjs public/allinkl.js test/allinkl-ssl.test.mjs
      - name: Commit dependencies and formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "SiteOps CI Formatter"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json app.mjs lib/allinkl.mjs lib/allinkl-ssl.mjs lib/lorzcms.mjs lib/allinkl-ui.mjs public/allinkl.js test/allinkl-ssl.test.mjs
            git commit -m "build: lock ACME library and format SSL automation"
            git push origin HEAD:feat/allinkl-acme-ssl-auto
          fi
