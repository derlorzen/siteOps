name: Format billing feature
on:
  push:
    branches:
      - feature/customer-time-billing
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/customer-time-billing
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format new billing files
        run: npx prettier --write app.mjs lib/billing.mjs lib/billing-pdf.mjs lib/billing-ui.mjs public/billing.js test/billing.test.mjs
      - name: Commit formatting only if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.mjs lib/billing.mjs lib/billing-pdf.mjs lib/billing-ui.mjs public/billing.js test/billing.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style: format billing implementation"
            git push origin HEAD:feature/customer-time-billing
          fi
