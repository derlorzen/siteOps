name: Format legacy retry test
on:
  push:
    branches: [fix/lorzcms-legacy-trailing-newline]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lorzcms-legacy-trailing-newline
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write test/lorzcms-legacy-retry.test.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/lorzcms-legacy-retry.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style: format LorzCMS legacy retry tests"
            git push origin HEAD:fix/lorzcms-legacy-trailing-newline
          fi
