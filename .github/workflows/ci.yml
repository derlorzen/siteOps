name: SiteOps CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: siteops-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Syntax check
        run: npm run check
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Runtime import check
        env:
          SITEOPS_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          MCP_API_TOKEN: ci-token
          DASHBOARD_USER: ci
          DASHBOARD_PASSWORD: ci-password
          GITHUB_BACKUP_REPO: example/siteops-backups
          GITHUB_BACKUP_TOKEN: ci-token
        run: npm run check:runtime
