name: SiteOps CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: siteops-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SITEOPS_APPROVAL_MODE: required
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: siteops_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install CMS PHP runtime
        run: sudo apt-get update && sudo apt-get install -y php-cli php-sqlite3 php-mbstring php-xml php-mysql
      - name: CMS PHP syntax and release build
        run: npm run cms:check && npm run cms:build
      - name: Syntax check
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Install browser runner dependencies
        working-directory: runner
        run: npm ci --ignore-scripts
      - name: Browser runner syntax check
        working-directory: runner
        run: npm run check
      - name: Browser runner import check
        working-directory: runner
        run: node -e "Promise.all([import('fastify'),import('pixelmatch'),import('pngjs'),import('playwright')]).then(()=>console.log('Runner imports OK'))"
      - name: Install Chromium for Search Console UI tests
        working-directory: runner
        run: npx playwright install --with-deps chromium
      - name: Search Console real browser workflow
        env:
          RUN_GSC_BROWSER_TESTS: '1'
        run: node --test test/search-console-browser.test.mjs
      - name: CRM filters and invoice draft browser workflow
        env:
          RUN_CRM_BROWSER_TESTS: '1'
        run: node --test test/billing-crm-browser.test.mjs
      - name: UI and MCP coverage registry
        run: npm run capabilities && git diff --exit-code -- docs/UI-MCP-COVERAGE.md
      - name: Product workflows, responsive layout and accessibility
        timeout-minutes: 4
        env:
          RUN_PRODUCT_BROWSER_TESTS: '1'
          RUN_SUITE_BROWSER_TESTS: '1'
          RUN_ANALYTICS_BROWSER_TESTS: '1'
          RUN_VIDEO_BROWSER_TESTS: '1'
        run: node --test test/product-browser.test.mjs test/video-suite-browser.test.mjs test/video-workflow-browser.test.mjs test/analytics-browser.test.mjs test/search-console-guidance-browser.test.mjs test/youtube-browser.test.mjs
      - name: Product QA screenshots and accessibility findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siteops-product-qa
          path: |
            .test-runtime/product-ui/
            .test-runtime/analytics-after/
            .test-runtime/gsc-guidance/
            /tmp/siteops-qa/screenshots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Runtime import check
        env:
          SITEOPS_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          MCP_API_TOKEN: ci-token
          DASHBOARD_USER: ci
          DASHBOARD_PASSWORD: ci-password
          GITHUB_BACKUP_REPO: example/siteops-backups
          GITHUB_BACKUP_TOKEN: ci-token
        run: npm run check:runtime
      - name: Test
        timeout-minutes: 3
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: ''
          DB_NAME: siteops_test
          SITEOPS_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DASHBOARD_USER: ci
          DASHBOARD_PASSWORD: ci-password
        run: npm test
