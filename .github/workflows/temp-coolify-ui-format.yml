name: Temporary Coolify Save Formatter
on:
  push:
    branches:
      - fix/coolify-connection-save-ui
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'derlorzen/siteOps'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/coolify-connection-save-ui
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npx prettier --write lib/coolify.mjs test/coolify.test.mjs app.mjs
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "SiteOps CI Formatter"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add lib/coolify.mjs test/coolify.test.mjs app.mjs
            git commit -m "style: format Coolify connection persistence fix"
            git push origin HEAD:fix/coolify-connection-save-ui
          fi
