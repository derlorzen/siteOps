name: Temporary HTTP-01 Formatter
on:
  push:
    branches: [fix/allinkl-ssl-http01-challenge]
permissions:
  contents: write
jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/allinkl-ssl-http01-challenge
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npx prettier --write lib/allinkl-http-challenge.mjs lib/allinkl-ssl.mjs test/allinkl-http-challenge.test.mjs
      - name: Commit format
        run: |
          if ! git diff --quiet; then
            git config user.name "SiteOps Formatter"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add lib/allinkl-http-challenge.mjs lib/allinkl-ssl.mjs test/allinkl-http-challenge.test.mjs
            git commit -m "style: format HTTP-01 SSL implementation"
            git push origin HEAD:fix/allinkl-ssl-http01-challenge
          fi
