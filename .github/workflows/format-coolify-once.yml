name: One-time Coolify formatter

on:
  push:
    paths:
      - '.github/workflows/format-coolify-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format only Coolify diagnostic files
        run: npx prettier --write lib/coolify.mjs test/coolify.test.mjs
      - name: Show exact formatter changes
        run: git diff -- lib/coolify.mjs test/coolify.test.mjs
