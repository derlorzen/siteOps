name: Format LorzCMS views and recovery
on:
  push:
    branches: [fix/lorzcms-recovery-and-real-navigation]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lorzcms-recovery-and-real-navigation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write app.mjs lib/lorzcms-workspace.mjs lib/lorzcms.mjs test/lorzcms-navigation.test.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.mjs lib/lorzcms-workspace.mjs lib/lorzcms.mjs test/lorzcms-navigation.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style: format CMS navigation and recovery"
            git push origin HEAD:fix/lorzcms-recovery-and-real-navigation
          fi
