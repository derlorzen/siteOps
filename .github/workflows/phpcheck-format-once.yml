name: Temporary PHP Checker Formatting
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phpcheck-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx prettier --write lib/tools.mjs test/tools.test.mjs
      - name: Commit formatting to temporary branch
        run: |
          git config user.name "siteops-format-bot"
          git config user.email "siteops-format-bot@users.noreply.github.com"
          git add lib/tools.mjs test/tools.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style: format PHP checker deadline fix"
          fi
          git push origin HEAD:refs/heads/autoformat-phpcheck-timeout-20261021
