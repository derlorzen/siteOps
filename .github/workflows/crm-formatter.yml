name: Format CRM regression tests
on:
  push:
    branches:
      - feat/clickup-style-project-workspace
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/clickup-style-project-workspace
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write test/billing-navigation.test.mjs test/migrations.test.mjs
      - name: Commit formatted tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/billing-navigation.test.mjs test/migrations.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style: format project workspace regression tests"
            git push origin HEAD:feat/clickup-style-project-workspace
          fi
