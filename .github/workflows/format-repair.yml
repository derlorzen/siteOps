name: One-time Prettier format repair
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/format-repair.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - name: Format five files reported by CI
        run: npx prettier --write app.mjs lib/allinkl-cms-move.mjs lib/allinkl.mjs lib/search-console.mjs test/allinkl-cms-move.test.mjs
      - name: Commit formatting to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.mjs lib/allinkl-cms-move.mjs lib/allinkl.mjs lib/search-console.mjs test/allinkl-cms-move.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style: apply Prettier to files failing CI"
            git push origin HEAD:main
          fi
