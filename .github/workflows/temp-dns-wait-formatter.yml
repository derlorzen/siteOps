name: Temporary ACME DNS Wait Formatter
on:
  push:
    branches:
      - fix/acme-dns-propagation-readiness
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/acme-dns-propagation-readiness
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npx prettier --write lib/allinkl-ssl.mjs test/allinkl-ssl.test.mjs
      - run: |
          if ! git diff --quiet; then
            git config user.name "SiteOps CI Formatter"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add lib/allinkl-ssl.mjs test/allinkl-ssl.test.mjs
            git commit -m "style: format ACME propagation checks"
            git push origin HEAD:fix/acme-dns-propagation-readiness
          fi
