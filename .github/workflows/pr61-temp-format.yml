name: Temporary PR61 Formatter

on:
  push:
    branches: [fix/coolify-asset-persistence-auto-version]

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'style: format PR61')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install formatter
        run: npm install --ignore-scripts
      - name: Apply repository formatting
        run: npx prettier --write app.mjs scripts/bump-version.mjs
      - name: Commit formatting
        run: |
          git config user.name "SiteOps CI Formatter"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app.mjs scripts/bump-version.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format PR61"
          git push origin HEAD:fix/coolify-asset-persistence-auto-version
