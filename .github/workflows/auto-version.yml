name: SiteOps automatische Versionierung

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: siteops-auto-version-main
  cancel-in-progress: false

jobs:
  version:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip version]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aktuellen Hauptbranch laden
        run: git pull --ff-only origin main
      - name: Patch-Version inkrementieren
        run: node scripts/bump-version.mjs
      - name: Versions-Commit veröffentlichen
        run: |
          git config user.name "SiteOps Release Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): SiteOps v$(node -p 'require("./package.json").version') [skip version]"
          git push origin HEAD:main
