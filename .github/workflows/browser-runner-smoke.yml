name: Browser Runner Smoke

on:
  pull_request:
    paths:
      - 'runner/**'
      - 'test/video-*.test.mjs'
      - 'lib/video-*.mjs'
      - 'public/video-studio.js'
      - 'test/youtube*.test.mjs'
      - 'lib/youtube*'
      - 'public/youtube*'
      - '.github/workflows/browser-runner-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: siteops-browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install runner dependencies
        working-directory: runner
        run: npm install --ignore-scripts
      - name: Install SiteOps test dependencies
        run: npm ci --ignore-scripts
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Chromium
        working-directory: runner
        run: npx playwright install --with-deps chromium
      - name: Video policy and real Chromium security tests (local HTTPS fixtures)
        env:
          RUN_VIDEO_BROWSER_TESTS: '1'
        run: node --test test/video-*.test.mjs
      - name: YouTube approval, OAuth and real browser UI tests
        env:
          RUN_VIDEO_BROWSER_TESTS: '1'
        run: node --test test/youtube*.test.mjs
      - name: Authenticated Full-HD recording and Video Suite chat UI
        env:
          RUN_SUITE_BROWSER_TESTS: '1'
        run: node --test test/video-login-browser.test.mjs test/video-suite-browser.test.mjs
      - name: Run real browser smoke test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/siteops-smoke
          cat > /tmp/siteops-smoke/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"><title>SiteOps Smoke</title></head>
          <body>
            <button id="go" onclick="document.querySelector('#result').textContent='OK'">Run</button>
            <div id="result">WAIT</div>
          </body>
          </html>
          HTML

          python3 -m http.server 8123 --bind 127.0.0.1 --directory /tmp/siteops-smoke >/tmp/siteops-smoke-site.log 2>&1 &
          SITE_PID=$!
          (
            cd runner
            VIDEO_ALLOWED_HOSTS=example.com VIDEO_TTS_MODE=silent BROWSER_RUNNER_TOKEN=ci-runner-token PORT=3299 HOST=127.0.0.1 node server.mjs
          ) >/tmp/siteops-smoke-runner.log 2>&1 &
          RUNNER_PID=$!

          cleanup() {
            kill "$RUNNER_PID" "$SITE_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3299/health >/dev/null; then break; fi
            sleep 1
          done

          curl -fsS             -H 'Authorization: Bearer ci-runner-token'             -H 'Content-Type: application/json'             --data '{"baseUrl":"http://127.0.0.1:8123/","steps":[{"action":"assertTitle","contains":"SiteOps Smoke"},{"action":"click","selector":"#go"},{"action":"assertText","selector":"#result","text":"OK"},{"action":"assertCount","selector":"button","count":1}],"captureScreenshot":true}'             http://127.0.0.1:3299/run > /tmp/siteops-run.json

          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/siteops-run.json','utf8')); if(!x.ok||!x.screenshotHash||x.steps.length!==4) { console.error(x); process.exit(1); } console.log({ok:x.ok,durationMs:x.durationMs,screenshotHash:x.screenshotHash,httpErrors:x.httpErrors});"

          curl -fsS             -H 'Authorization: Bearer ci-runner-token'             -H 'Content-Type: application/json'             --data '{"url":"http://127.0.0.1:8123/"}'             http://127.0.0.1:3299/render > /tmp/siteops-render.json

          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/siteops-render.json','utf8')); if(!x.ok||!x.html||!x.html.includes('SiteOps Smoke')) { console.error(x); process.exit(1); } console.log({ok:x.ok,statusCode:x.statusCode,finalUrl:x.finalUrl});"

          # Integration: render a real MP4 and a vertical short without external model assets.
          curl -fsS -H 'Authorization: Bearer ci-runner-token' \
            -H 'Content-Type: application/json' \
            --data '{"id":"22222222-2222-4222-8222-222222222222","title":"CI Bagisto Tutorial","voice":"am_michael","language":"en","format":"landscape","scenes":[{"headline":"Bagisto Video Studio","narration":"This is a real offline rendering smoke test."}]}' \
            http://127.0.0.1:3299/video/jobs > /tmp/siteops-video-created.json
          for i in {1..90}; do
            curl -fsS -H 'Authorization: Bearer ci-runner-token' \
              http://127.0.0.1:3299/video/jobs/22222222-2222-4222-8222-222222222222 \
              > /tmp/siteops-video-status.json
            result="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/siteops-video-status.json','utf8')).status")"
            if [[ "$result" == "done" ]]; then break; fi
            if [[ "$result" == "failed" ]]; then cat /tmp/siteops-video-status.json; exit 1; fi
            sleep 2
          done
          test "$result" = "done"
          curl -fsS -H 'Authorization: Bearer ci-runner-token' \
            'http://127.0.0.1:3299/video/jobs/22222222-2222-4222-8222-222222222222/file?kind=video' \
            -o /tmp/siteops-video-test.mp4
          curl -fsS -H 'Authorization: Bearer ci-runner-token' \
            'http://127.0.0.1:3299/video/jobs/22222222-2222-4222-8222-222222222222/file?kind=short' \
            -o /tmp/siteops-video-short.mp4
          test "$(stat -c%s /tmp/siteops-video-test.mp4)" -gt 10000
          # Authenticated HEAD/Range bridge used by durable YouTube uploads.
          curl -fsSI -H 'Authorization: Bearer ci-runner-token' \
            'http://127.0.0.1:3299/video/jobs/22222222-2222-4222-8222-222222222222/file?kind=video' \
            > /tmp/siteops-video-head.txt
          curl -fsS -H 'Authorization: Bearer ci-runner-token' -H 'Range: bytes=0-15' \
            -D /tmp/siteops-video-range.txt \
            'http://127.0.0.1:3299/video/jobs/22222222-2222-4222-8222-222222222222/file?kind=video' \
            -o /tmp/siteops-video-prefix.bin
          node -e "const fs=require('fs'),assert=require('assert/strict');const head=fs.readFileSync('/tmp/siteops-video-head.txt','utf8'),range=fs.readFileSync('/tmp/siteops-video-range.txt','utf8');assert.match(head,/content-length:/i);assert.match(range,/206/);assert.match(range,/content-range: bytes 0-15\//i);assert.deepEqual(fs.readFileSync('/tmp/siteops-video-prefix.bin'),fs.readFileSync('/tmp/siteops-video-test.mp4').subarray(0,16));"
          test "$(stat -c%s /tmp/siteops-video-short.mp4)" -gt 10000
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 /tmp/siteops-video-test.mp4

          # German offline Piper job: validate language/provider pairing and produce MP4.
          curl -fsS -H 'Authorization: Bearer ci-runner-token' \
            -H 'Content-Type: application/json' \
            --data '{"id":"44444444-4444-4444-8444-444444444444","title":"Deutsche Videovorstellung","voiceProvider":"piper","voice":"de_DE-thorsten-medium","language":"de","format":"landscape","scenes":[{"headline":"Deutschsprachige Einführung","narration":"Dieser Test überprüft die deutsche Videoproduktion."}]}' \
            http://127.0.0.1:3299/video/jobs > /tmp/siteops-german-created.json
          for i in {1..90}; do
            curl -fsS -H 'Authorization: Bearer ci-runner-token' \
              http://127.0.0.1:3299/video/jobs/44444444-4444-4444-8444-444444444444 \
              > /tmp/siteops-german-status.json
            result="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/siteops-german-status.json','utf8')).status")"
            if [[ "$result" == "done" ]]; then break; fi
            if [[ "$result" == "failed" ]]; then cat /tmp/siteops-german-status.json; exit 1; fi
            sleep 2
          done
          test "$result" = "done"
          curl -fsS -H 'Authorization: Bearer ci-runner-token' \
            'http://127.0.0.1:3299/video/jobs/44444444-4444-4444-8444-444444444444/file?kind=video' \
            -o /tmp/siteops-german-test.mp4
          test "$(stat -c%s /tmp/siteops-german-test.mp4)" -gt 10000
          curl -fsS -H 'Authorization: Bearer ci-runner-token' http://127.0.0.1:3299/video/capabilities \
            > /tmp/siteops-video-capabilities.json
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/siteops-video-capabilities.json','utf8'));if(!x.languages.includes('de')||!x.providers.de.includes('piper')) process.exit(1);"

          # Record a real browser scene with a safe, allowlisted HTTPS site.
          curl -fsS -H 'Authorization: Bearer ci-runner-token' \
            -H 'Content-Type: application/json' \
            --data '{"id":"33333333-3333-4333-8333-333333333333","title":"CI Browser Recording","voice":"am_michael","language":"en","format":"landscape","scenes":[{"headline":"Real browser recording","narration":"Watch a browser scroll on this public sample page.","demoUrl":"https://example.com/","test_data_only":true,"demoSteps":[{"action":"scroll","pixels":250},{"action":"wait","ms":300}]}]}' \
            http://127.0.0.1:3299/video/jobs > /tmp/siteops-video-demo-created.json
          for i in {1..90}; do
            curl -fsS -H 'Authorization: Bearer ci-runner-token' \
              http://127.0.0.1:3299/video/jobs/33333333-3333-4333-8333-333333333333 \
              > /tmp/siteops-video-demo-status.json
            result="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/siteops-video-demo-status.json','utf8')).status")"
            if [[ "$result" == "done" ]]; then break; fi
            if [[ "$result" == "failed" ]]; then cat /tmp/siteops-video-demo-status.json; exit 1; fi
            sleep 2
          done
          test "$result" = "done"
          curl -fsS -H 'Authorization: Bearer ci-runner-token' \
            'http://127.0.0.1:3299/video/jobs/33333333-3333-4333-8333-333333333333/file?kind=video' \
            -o /tmp/siteops-video-demo.mp4
          test "$(stat -c%s /tmp/siteops-video-demo.mp4)" -gt 10000
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 /tmp/siteops-video-demo.mp4



  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runner image
        run: docker build -t siteops-browser-runner ./runner
      - name: Run real browser smoke test against the container
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/siteops-smoke
          cat > /tmp/siteops-smoke/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"><title>SiteOps Docker Smoke</title></head>
          <body>OK</body>
          </html>
          HTML

          python3 -m http.server 8123 --bind 0.0.0.0 --directory /tmp/siteops-smoke >/tmp/siteops-smoke-site.log 2>&1 &
          SITE_PID=$!
          trap 'kill "$SITE_PID" 2>/dev/null || true; docker rm -f siteops-runner-smoke >/dev/null 2>&1 || true' EXIT

          docker run -d --name siteops-runner-smoke --network host \
            -e BROWSER_RUNNER_TOKEN=ci-runner-token -e HOST=127.0.0.1 -e PORT=3299 \
            siteops-browser-runner

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3299/health >/dev/null; then break; fi
            sleep 1
          done

          curl -fsS             -H 'Authorization: Bearer ci-runner-token'             -H 'Content-Type: application/json'             --data '{"url":"http://127.0.0.1:8123/"}'             http://127.0.0.1:3299/render > /tmp/siteops-docker-render.json

          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/siteops-docker-render.json','utf8')); if(!x.ok||!x.html||!x.html.includes('SiteOps Docker Smoke')) { console.error(x); process.exit(1); } console.log({ok:x.ok,statusCode:x.statusCode,finalUrl:x.finalUrl});"

          # Verify actual downloaded voice models and real German/English speech.
          docker exec siteops-runner-smoke /opt/video-venv/bin/python3 /app/ensure-voice-models.py \
            --provider piper --directory /data/video-studio/models
          docker exec siteops-runner-smoke sh -c 'printf "Guten Tag aus SiteOps." > /tmp/voice-de.txt'
          docker exec siteops-runner-smoke /opt/video-venv/bin/python3 /app/piper-voice.py \
            --model /data/video-studio/models/de_DE-thorsten-medium.onnx \
            --text /tmp/voice-de.txt --output /tmp/voice-de.wav
          docker exec siteops-runner-smoke ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 /tmp/voice-de.wav

          docker exec siteops-runner-smoke /opt/video-venv/bin/python3 /app/ensure-voice-models.py \
            --provider kokoro --directory /data/video-studio/models
          docker exec siteops-runner-smoke sh -c 'printf "Hello from SiteOps." > /tmp/voice-en.txt'
          docker exec siteops-runner-smoke /opt/video-venv/bin/python3 /app/kokoro-voice.py \
            --model /data/video-studio/models/kokoro-v1.0.onnx \
            --voices /data/video-studio/models/voices-v1.0.bin \
            --text /tmp/voice-en.txt --output /tmp/voice-en.wav --voice am_michael --language en
          docker exec siteops-runner-smoke ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 /tmp/voice-en.wav

          docker logs siteops-runner-smoke
