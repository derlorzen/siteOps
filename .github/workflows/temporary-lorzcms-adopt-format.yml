name: One-time LorzCMS adopt format
on:
  push:
    branches: [fix/lorzcms-adopt-recovery]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format only the changed server and test files
        run: |
          npx prettier --write app.mjs lib/lorzcms.mjs lib/lorzcms-adopt.mjs lib/lorzcms-workspace.mjs lib/capability-registry.mjs test/lorzcms-adopt.test.mjs test/lorzcms-coordinator.test.mjs
          git diff --check
          git config user.name "SiteOps CI Formatter"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app.mjs lib/lorzcms.mjs lib/lorzcms-adopt.mjs lib/lorzcms-workspace.mjs lib/capability-registry.mjs test/lorzcms-adopt.test.mjs test/lorzcms-coordinator.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style: format LorzCMS adopt recovery"
            git push origin HEAD:refs/heads/fix/lorzcms-adopt-recovery
          fi
      - run: node --check lib/lorzcms.mjs && node --test test/lorzcms-adopt.test.mjs
