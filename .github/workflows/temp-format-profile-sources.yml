name: Temporary Server Profile Source Test Formatter
on:
  push:
    branches:
      - fix/server-profiles-source-websites
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'derlorzen/siteOps'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/server-profiles-source-websites
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npx prettier --write test/server-profile-sources.test.mjs
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "SiteOps CI Formatter"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add test/server-profile-sources.test.mjs
            git commit -m "style: format existing website profile source tests"
            git push origin HEAD:fix/server-profiles-source-websites
          fi
